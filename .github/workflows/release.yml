name: Release

# Push a tag shaped like v1.2.3 to publish a signed APK as a GitHub release.
# The version in the APK is derived from the tag; the tag must therefore be
# MAJOR.MINOR.PATCH so that versionCode can be incremented automatically.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, without the leading v (for example 1.2.3)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("KEYSTORE_BASE64")
          [ -n "$STORE_PASSWORD" ] || missing+=("STORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See docs/releasing.md."
            exit 1
          fi

      - name: Resolve the version from the tag
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-.*)?$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$TAG'."
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          # Without this bound the scheme collides: v1.100.0 would produce 20000, the same
          # versionCode as v2.0.0, and could not be installed over it.
          if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ] || [ "$major" -ge 210000 ]; then
            echo "::error::Tag '$TAG' is out of range: minor and patch must be below 100."
            exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))
          {
            echo "tag=${TAG}"
            echo "version=$version"
            echo "code=$code"
            echo "prerelease=$([ -n "${BASH_REMATCH[4]}" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $version (versionCode $code) from tag $TAG"

      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Verify, then assemble the signed APK
        run: |
          ./gradlew --no-daemon \
            :adb:testDebugUnitTest \
            :scrcpy:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            -PascrcpyVersionName=${{ steps.version.outputs.version }} \
            -PascrcpyVersionCode=${{ steps.version.outputs.code }}

      - name: Confirm the APK is signed
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          echo "Built $apk"
          if [ "$(basename "$apk")" = "app-release-unsigned.apk" ]; then
            echo "::error::$apk is unsigned; the keystore secrets were not applied."
            exit 1
          fi
          apksigner=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --verbose --print-certs "$apk" | grep -E "Verified using|DN:" | head
          else
            echo "::notice::apksigner not found; skipping certificate verification."
          fi
          cp "$apk" "AScrcpy-${{ steps.version.outputs.version }}.apk"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          notes=$(mktemp)
          {
            echo "AScrcpy $VERSION, signed release build."
            echo
            echo "Built from \`$GITHUB_SHA\` and pushed to \`$TAG\`."
            echo
            echo "The APK redistributes the unmodified scrcpy 4.0 server; see THIRD_PARTY_NOTICES.md."
          } > "$notes"
          prerelease=()
          [ "$PRERELEASE" = "true" ] && prerelease+=("--prerelease")
          gh release create "$TAG" \
            "AScrcpy-$VERSION.apk" LICENSE THIRD_PARTY_NOTICES.md \
            --title "AScrcpy $VERSION" \
            --notes-file "$notes" \
            --generate-notes \
            "${prerelease[@]}"

      - name: Clean up the keystore
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"
